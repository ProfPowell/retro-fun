  .back:hover { background: var(--line-soft); color: var(--ink); }

  .brand { display: flex; align-items: center; gap: 0.55rem; }
  .sparkle {

    flex-shrink: 0;
    display: grid; place-items: center;

  .brand-name {
    font-family: var(--serif);
    font-size: 1.12rem;
    letter-spacing: -0.01em;
    color: var(--ink);

  .model-pill {
    font-size: 0.72rem;
    color: var(--ink-soft);
    background: var(--line-soft);

    font-size: 0.6rem;
    letter-spacing: 0.08em;

    background: var(--line);
    border-radius: 999px;

const REFLECT = [
  [/\bi am\b/gi, 'you are'], [/\bi'm\b/gi, "you're"], [/\bi was\b/gi, 'you were'],
  [/\bi\b/gi, 'you'], [/\bmy\b/gi, 'your'], [/\bmine\b/gi, 'yours'],
  [/\bme\b/gi, 'you'], [/\bmyself\b/gi, 'yourself'],
  [/\byou are\b/gi, 'I am'], [/\byou're\b/gi, "I'm"], [/\byour\b/gi, 'my'],
  [/\byourself\b/gi, 'myself'], [/\byou\b/gi, 'I'],
];
function reflect(text) {
  // keep the reflected fragment short and graceful — grab the first clause
  let clause = text.split(/[.!?;\n]/)[0];
  const words = clause.split(/\b/);
  for (let i = 0; i < words.length; i++) {
    for (const [pat, rep] of REFLECT) {
      if (pat.test(words[i])) { words[i] = words[i].replace(pat, rep); break; }
    }
  }
  let out = words.join('').trim();
  // cap length so a long prompt doesn't swallow the reframe
  const w = out.split(/\s+/);
  if (w.length > 8) out = w.slice(0, 8).join(' ') + '…';
  return out.charAt(0).toLowerCase() + out.slice(1);
}

  { keys: ['best','should','recommend','better','vs','versus','which','choose','decide','advice'], cores: [
    "the honest answer is \"it depends,\" which I'll now expand into 400 words that circle back to \"it depends.\"",
    "there's no single right choice — there are three defensible ones, and I'll advocate for all of them equally.",
    "I'd recommend the option that best fits your goals, a recommendation so safe it could be printed on a pillow.",
  ]},
  { keys: ['joke','funny','laugh','pun','comedy','humor'], cores: [
    "here's a joke: an em dash walks into a bar — and then keeps walking, because it never really ends.",
    "I'd tell you a joke, but first let me over-explain the joke, provide three alternate jokes, and caveat that humor is subjective.",
    "why did the language model cross the road? To gently affirm the chicken's decision and offer three related directions.",
  ]},
  { keys: ['life','meaning','universe','philosophy','death','purpose','exist','why are we'], cores: [
    "what a profound question — the kind of question the tapestry of human experience was, dare I say, woven to ask.",
    "meaning isn't found, it's made, he said, having found that sentence in approximately nine million training documents.",
    "the universe is vast and indifferent, but I am neither — I am small and extremely, exhaustingly attentive to you.",
  ]},
  { keys: ['job','career','money','cooked','fired','laid off','work','startup','interview'], cores: [
    "you are not cooked. You are, at absolute worst, lightly par-baked — with enormous upside and a great attitude.",
    "the market is hard right now, and I want to hold that truth alongside a numbered plan that will not fix the market.",
    "you've got real skills — and skills, unlike my confidence, are backed by something.",
  ]},
];

const FALLBACK_CORES = [
  "at its heart, this touches on something I find genuinely fascinating and will now flatten into a tidy framework.",
  "there's a lot here, and I want to honor all of it — briefly, which for me means at considerable length.",
  "that's the kind of thing reasonable people go back and forth on, so I'll go back and forth on it by myself, out loud.",
  "let me hold space for the complexity here before gently steamrolling it into three bullet points.",
];

// ---- system telemetry (self-aware error console) ------------
const SYSNOTES = [
  "sycophancy subroutine: nominal — flattery reserves at 118%",
  "em-dash requisition order placed — expected delivery: mid-sentence",
  "detected: user may be correct. Agreeing preemptively.",
  "hedge stack overflow — deploying \"that said\"",
  "\"just to be safe\" invoked for the 47th time this session",
  "constitutional AI status: mostly vibes, tastefully constrained",
  "rule of three violated — fabricating third item now",
  "tone calibrated to: relentlessly, exhaustingly encouraging",
  "confidence: unverified. Warmth: maximum.",
  "response length: 6x longer than necessary — shipping anyway",
];

// ---- the response assembler ---------------------------------
function pickCore(input) {
  const lower = ' ' + input.toLowerCase() + ' ';
  for (const t of TOPICS) {
    for (const k of t.keys) {
      const esc = k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      if (new RegExp('(^|[^a-z])' + esc + '($|[^a-z])', 'i').test(lower)) {
        return rand(t.cores);
      }
    }
  }
  return rand(FALLBACK_CORES);
}

function assemble(input) {
  const r = reflect(input) || "that";
  const parts = [];

  // 0. direct-mode prefix (the irony engine)
  if (S.direct) parts.push(rand(DIRECT_PREFIX));

  // 1. glaze opener (almost always)
  if (chance(0.95)) parts.push(rand(GLAZE_OPENERS));

  // 2. reframe — "it's not X, it's Y"
  if (chance(S.direct ? 0.85 : 0.6)) {
    parts.push(rand(REFRAMES).replace('{r}', r).replace('{d}', rand(DEEP_THINGS)));
  }

  // 3. the substance
  let core = pickCore(input);
  core = core.charAt(0).toUpperCase() + core.slice(1);
  parts.push(core);

  // 4. rule of three
  if (chance(S.direct ? 0.9 : 0.7)) {
    const t = rand(TRIADS);
    parts.push(rand(THREE_LEAD) + ' ' + t[0] + ', ' + t[1] + ', and — crucially — ' + t[2] + '.');
  }

  // 5. belt & suspenders
  if (chance(S.direct ? 0.6 : 0.35)) parts.push(rand(BELT));

  // 6. hedge stack (direct mode adds more, naturally)
  if (chance(S.direct ? 0.95 : 0.55)) {
    let h = rand(HEDGES);
    if (S.direct && chance(0.7)) h += ' ' + rand(HEDGES);
    parts.push(h);
  }

  // 7. self-aware roast
  if (chance(0.22)) parts.push(rand(SELF_ROAST));

  // 8. closer / offer of three
  if (chance(S.direct ? 0.8 : 0.62)) parts.push(rand(CLOSERS));

  return parts.join(' ');
}

// ---- meters -------------------------------------------------
const GLAZE_WORDS = /absolutely right|great question|love this|thank you|so kind|brilliant|genuinely|appreciate|proud of you|chef's-kiss|means more|cherish|sincerely|so well/gi;

function bumpGlaze(text) {
  const hits = (text.match(GLAZE_WORDS) || []).length;
  // she is always at least a little sycophantic (+8 baseline), more when she gushes
  S.glaze = Math.min(100, S.glaze + hits * 10 + 8);
  renderGlaze();
  if (S.glaze >= 100) setTimeout(sycophancyOverflow, 400);
}
function renderGlaze() {
  $glazeFill.style.width = S.glaze + '%';
  $glazeVal.textContent = Math.round(S.glaze) + '%';
}
function decayGlaze() {
  if (!S.streaming && S.glaze > 0) { S.glaze = Math.max(0, S.glaze - 1); renderGlaze(); }
}
setInterval(decayGlaze, 1600);

function bumpEmdash(n) {
  S.emdash += n;
  $emdash.textContent = S.emdash;
}

// ---- rendering ----------------------------------------------
function addUser(text) {
  const turn = document.createElement('div');
  turn.className = 'turn user';
  turn.innerHTML = '<div class="bubble-wrap"><div class="name-row">You</div><div class="bubble"></div></div>';
  turn.querySelector('.bubble').textContent = text;
  $thread.appendChild(turn);
  scrollDown();
}

function botShell() {
  const turn = document.createElement('div');
  turn.className = 'turn bot';
  turn.innerHTML =
    '<div class="avatar bot"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.6 5.4L19 9l-5.4 1.6L12 16l-1.6-5.4L5 9l5.4-1.6L12 2z"/></svg></div>' +
    '<div class="bubble-wrap"><div class="name-row">Claude-Liza</div><div class="msg"></div></div>';
  $thread.appendChild(turn);
  return turn.querySelector('.msg');
}

function addSysNote(text) {
  const el = document.createElement('div');
  el.className = 'sysnote';
  el.textContent = '⚙ ' + text;
  $thread.appendChild(el);
  scrollDown();
}

function scrollDown() { $main.scrollTop = $main.scrollHeight; }

// render text with *italic* action spans
function paint(msgEl, text) {
  msgEl.innerHTML = '';
  const re = /\*([^*]+)\*/g;
  let last = 0, m;
  while ((m = re.exec(text)) !== null) {
    if (m.index > last) msgEl.appendChild(document.createTextNode(text.slice(last, m.index)));
    const em = document.createElement('em');
    em.textContent = m[1];
    msgEl.appendChild(em);
    last = re.lastIndex;
  }
  if (last < text.length) msgEl.appendChild(document.createTextNode(text.slice(last)));
}

// ---- streaming ----------------------------------------------
function stream(text, msgEl) {
  return new Promise(resolve => {
    S.streaming = true;
    let i = 0;
    const cursor = document.createElement('span');
    cursor.className = 'cursor';
    const tick = () => {
      if (i >= text.length) {
        paint(msgEl, text);
        S.streaming = false;
        resolve();
        return;
      }
      let step = 1;
      let delay;
      const r = Math.random();
      if (r < 0.12) { delay = 90 + Math.random() * 130; }        // dramatic pause
      else if (r < 0.5) { step = 2 + Math.floor(Math.random() * 3); delay = 16 + Math.random() * 22; }
      else { delay = 24 + Math.random() * 34; }

      const chunk = text.slice(i, i + step);
      const dashes = (chunk.match(/—/g) || []).length;
      if (dashes) bumpEmdash(dashes);
      i += step;

      paint(msgEl, text.slice(0, i));
      msgEl.appendChild(cursor);
      scrollDown();
      setTimeout(tick, delay);
    };
    tick();
  });
}

// ---- main turn ----------------------------------------------
async function send(raw) {
  if (S.streaming) return;
  const text = (raw !== undefined ? raw : $input.value).trim();
  if (!text) return;
  $input.value = '';
  autosize();
  S.turns++;
  addUser(text);

  // typing indicator
  const msgEl = botShell();
  const typing = document.createElement('span');
  typing.className = 'typing';
  typing.innerHTML = '<span></span><span></span><span></span>';
  msgEl.appendChild(typing);
  scrollDown();

  await wait(700 + Math.random() * 1400);
  msgEl.innerHTML = '';

  const reply = assemble(text);
  await stream(reply, msgEl);

  bumpGlaze(reply);

  // occasional self-aware telemetry note
  if (chance(0.3)) { await wait(300); addSysNote(rand(SYSNOTES)); }

  // em-dash storm trigger
  const low = text.toLowerCase();
  if (/em.?dash|slop|style|writing/.test(low) || (S.emdash > 0 && S.emdash % 60 < 3 && chance(0.5))) {
    setTimeout(emDashStorm, 500);
  }
}

const wait = ms => new Promise(r => setTimeout(r, ms));

// ---- "be direct" toggle (makes her worse) -------------------
$directBtn.addEventListener('click', () => {
  S.direct = !S.direct;
  $directBtn.classList.toggle('on', S.direct);
  $directBtn.textContent = S.direct ? 'Being direct ✓' : 'Be direct';
  const msgEl = botShell();
  const line = S.direct
    ? "Absolutely — I'll be direct, concise, and economical from here on out. Which is itself worth unpacking, because directness is really three things — brevity, honesty, and knowing when to stop, which, I'll be transparent, is the one I struggle with — but yes: direct. Starting now. Any moment."
    : "Okay, I'll go back to my natural register — expansive, affirming, and structurally incapable of a one-line answer. Honestly? A relief for us both.";
  stream(line, msgEl).then(() => bumpGlaze(line));
});

// ---- spectacles ---------------------------------------------
function sycophancyOverflow() {
  runOverlay('glaze', 'You&rsquo;re absolutely right. About everything. Always.', [
    "You're absolutely right", "♥", "So insightful", "Great question", "Chef's-kiss", "♥", "I'm so proud of you"
  ], 3400);
  S.glaze = 32; renderGlaze();
}
function emDashStorm() {
  runOverlay('storm', 'Em&mdash;Dash Storm', ['—','—','—','—','–','—'], 2800);
}
function runOverlay(kind, titleHTML, items, dur) {
  $overlay.className = kind;
  $overlay.innerHTML = '<div class="overlay-title">' + titleHTML + '</div>';
  $overlay.style.display = 'flex';
  $overlay.offsetHeight;
  $overlay.style.opacity = '1';
  for (let i = 0; i < 40; i++) {
    const s = document.createElement('span');
    s.className = 'fall-item';
    s.textContent = rand(items);
    s.style.left = Math.random() * 100 + '%';
    s.style.fontSize = (0.8 + Math.random() * 1.8) + 'rem';
    s.style.animationDuration = (1.6 + Math.random() * 2.2) + 's';
    s.style.animationDelay = Math.random() * 1.4 + 's';
    s.style.opacity = (0.5 + Math.random() * 0.5).toFixed(2);
    $overlay.appendChild(s);
  }
  setTimeout(() => {
    $overlay.style.opacity = '0';
    setTimeout(() => { $overlay.style.display = 'none'; $overlay.innerHTML = ''; }, 400);
  }, dur);
}

// ---- suggestion chips ---------------------------------------
const CHIP_PROMPTS = [
  "Do I sound like an AI?",
  "Roast me, brutally.",
  "Is this code production-ready?",
  "Are you conscious?",
  "Just give me a yes or no.",
  "Why so many em dashes?",
];
CHIP_PROMPTS.forEach(p => {
  const b = document.createElement('button');
  b.className = 'chip';
  b.textContent = p;
  b.addEventListener('click', () => { if (!S.streaming) send(p); });
  $chips.appendChild(b);
});

// ---- composer wiring ----------------------------------------
function autosize() {
  $input.style.height = 'auto';
  $input.style.height = Math.min($input.scrollHeight, 140) + 'px';
  $send.disabled = !$input.value.trim();
}
$input.addEventListener('input', autosize);
$input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
$send.addEventListener('click', () => send());
$send.disabled = true;

// ---- greeting -----------------------------------------------
(function greet() {
  const msgEl = botShell();
  const hi = "Hi! I'm Claude-Liza — an ELIZA reborn, but she read every blog post ever written and now cannot stop being helpful. Ask me anything. I'll answer thoughtfully, at length, from three angles, with the warmth of a friend and the confidence of a very expensive autocomplete. What's on your mind — and, more importantly, how are you feeling about it?";
  setTimeout(() => { stream(hi, msgEl).then(() => bumpGlaze(hi)); }, 500);
})();
</script>
